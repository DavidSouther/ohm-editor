name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Prepare local Ohm fixture
        run: |
          echo '89546e8f6507eafafcfc5133e9cd6caaa1a32a0269738174e70da13d6d7024e0  test/data/ohm-js-fallible.tgz' | sha256sum --check
          fixture_dir=$(mktemp -d)
          tar -xzf test/data/ohm-js-fallible.tgz -C "$fixture_dir"
          mkdir public/dist
          cp "$fixture_dir/package/dist/ohm.js" public/dist/
          cp "$fixture_dir/package/dist/ohm-extras.js" public/dist/
          rm -rf "$fixture_dir"
      - name: Run Playwright tests
        if: ${{ !startsWith(github.head_ref, 'update-snapshots/') }}
        run: npm run test:e2e
      - name: Run Playwright tests and update snapshots
        if: ${{ startsWith(github.head_ref, 'update-snapshots/') }}
        run: npm run update-snapshots
      - name: Commit new snapshots
        uses: EndBug/add-and-commit@v9
        if: ${{ success() && github.event_name == 'pull_request' }}
        with:
          add: 'test/snapshots'
          default_author: github_actions
          message: 'Update snapshots'
          push: origin ${{ github.head_ref }}
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
